name: Release

# Push a tag matching the version in Cargo.toml, e.g. `v0.1.0`, to publish a release.
# Tags with a suffix (`v0.2.0-rc.1`) are published as pre-releases.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.asset_os }}-${{ matrix.arch }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            arch: x86_64
            bin: studio-run.exe
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_os: macos
            arch: aarch64
            bin: studio-run
            test: true
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_os: macos
            arch: x86_64
            bin: studio-run
            test: false
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Unit tests
        if: matrix.test
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      # Foreman, Rokit and Aftman pick the asset whose name contains the OS
      # and architecture, and expect a zip holding just the executable.
      - name: Package
        shell: bash
        env:
          BIN: target/${{ matrix.target }}/release/${{ matrix.bin }}
          NAME: studio-run-${{ needs.version.outputs.version }}-${{ matrix.asset_os }}-${{ matrix.arch }}.zip
        run: |
          set -euo pipefail
          mkdir -p dist
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          "$PY" -c 'import hashlib, os, zipfile
          from pathlib import Path
          bin_path = Path(os.environ["BIN"])
          name = os.environ["NAME"]
          dest = Path("dist") / name
          with zipfile.ZipFile(dest, "w", compression=zipfile.ZIP_DEFLATED) as archive:
              archive.write(bin_path, arcname=bin_path.name)
          digest = hashlib.sha256(dest.read_bytes()).hexdigest()
          (dest.parent / (name + ".sha256")).write_text("%s  %s\n" % (digest, name))
          '

      - uses: actions/upload-artifact@v4
        with:
          name: studio-run-${{ matrix.asset_os }}-${{ matrix.arch }}
          path: dist/*

  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.zip dist/*.sha256)
          if [ "${#files[@]}" -ne 6 ]; then
            echo "expected 3 zips and 3 checksums, found ${#files[@]}: ${files[*]}" >&2
            exit 1
          fi
          flags=(--verify-tag --generate-notes --title "$GITHUB_REF_NAME")
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" "${flags[@]}"
