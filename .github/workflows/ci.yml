name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The end-to-end tests in tests/studio.rs are #[ignore]d: they need a
      # logged-in Roblox Studio, which CI runners don't have. They still compile here.
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release

  # The single check to require on the branch. It fails unless every OS above
  # passed. It runs even when the matrix fails, because a skipped job would
  # not block merging.
  tests:
    name: Clippy and tests
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every OS to pass
        run: |
          echo "matrix result: ${{ needs.check.result }}"
          test "${{ needs.check.result }}" = "success"
