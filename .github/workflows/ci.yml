name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: Clippy and tests (${{ matrix.os }})
    # Windows and macOS build the local Studio host and the cloud host; Linux
    # builds the cloud host alone.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      # The end-to-end tests are #[ignore]d: tests/studio.rs needs a logged-in
      # Roblox Studio, which CI runners don't have, and the real-API cloud tests
      # need secrets (see cloud.yml, weekly). They still compile here. The
      # unit tests include tests/cloud_mock.rs: --cloud against a local mock API.
      - name: Unit tests
        run: cargo test --locked
      - name: Release build
        run: cargo build --locked --release

  # The single check to require on the branch. It fails unless every OS above
  # passed. It runs even when the matrix fails, because a skipped job would
  # not block merging.
  tests:
    name: Clippy and tests
    needs: check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every OS to pass
        run: |
          echo "matrix result: ${{ needs.check.result }}"
          test "${{ needs.check.result }}" = "success"
