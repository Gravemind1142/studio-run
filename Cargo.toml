[package]
name = "studio-run"
version = "0.1.0"
edition = "2024"
description = "Run Luau scripts in Roblox Studio on Windows without Studio appearing on screen"
license = "MIT"
repository = "https://github.com/Gravemind1142/studio-run"
readme = "README.md"
keywords = ["roblox", "roblox-studio", "luau", "cli", "headless"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
clap = { version = "4.6.9", features = ["derive", "env"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
